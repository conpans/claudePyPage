id: positions-last-item
title: The last item
tier: exercise
format: fill
skill: positions
skills: [positions]
difficulty: 1
source:
  type: original

goal: Read the item at the last position of a list.
statement: |
  The program below works out the last position of `numbers` and stores it in `last_position`. The line that reads the item at that position is missing.

  Write that line, so that when the program ends `last_item` holds the last item of `numbers`.
given:
  - name: numbers
    type: list[int]
    describe: a list of whole numbers
    domain: { minLen: 1, maxLen: 10, min: -50, max: 50 }
create:
  - name: last_item
    describe: the item at the last position of `numbers`
rules:
  - '`numbers` has from 1 to 10 items, each a whole number from -50 to 50.'
  - With one item, that item is the last item.
  - Leave `numbers` unchanged.
toWrite: One line, in place of the comment.
unchanged: [numbers]

starter: |
  last_position = len(numbers) - 1
  # your line goes here
exampleGiven: { numbers: [40, 10, 30, 20] }
examples:
  - given: { numbers: [40, 10, 30, 20] }
    result: { last_item: 20 }
    why: The list has 4 items, so the last position is 3, and the item at position 3 is 20.
  - given: { numbers: [7] }
    result: { last_item: 7 }
    why: One item, at position 0. The last position is 1 - 1, which is 0, and the item there is 7.

tests:
  - name: four items
    given: { numbers: [40, 10, 30, 20] }
    expect: { last_item: 20 }
    purpose: The example from the task. The last item, 20, is neither the last position, 3, nor the length, 4.
  - name: one item
    given: { numbers: [7] }
    expect: { last_item: 7 }
    purpose: The shortest list allowed. Position 0 is both the first and the last position.
  - name: last item is 0
    given: { numbers: [12, 0] }
    expect: { last_item: 0 }
    purpose: 0 is an ordinary item and can be the answer.
  - name: the smallest and largest values allowed
    given: { numbers: [50, -50] }
    expect: { last_item: -50 }
    purpose: The edges of the values allowed. The last item, -50, is negative, while the last position is 1 and the length is 2.
  - name: the longest list allowed
    given: { numbers: [3, 14, 15, 9, 26, 5, 35, 8, 9, 7] }
    expect: { last_item: 7 }
    purpose: Ten items sit at the positions 0 to 9. Catches storing the position 9 or the length 10.

mistakes:
  - id: stores-position
    label: Stores the last position instead of the item there
    shows: wrong-result
    code: |
      last_position = len(numbers) - 1
      last_item = last_position
    feedback: |
      Your `last_item` is one less than the number of items. That is the last position itself, not the item stored there. `last_position` says where to look. Reading the item at that place takes the list name and brackets.
  - id: one-too-far
    label: Asks for the position equal to the length
    shows: error
    errorType: IndexError
    code: |
      last_position = len(numbers) - 1
      last_item = numbers[len(numbers)]
    feedback: |
      The program asked for a position the list does not have. The positions of a list run from 0 to one less than its length: with 4 items they are 0, 1, 2 and 3, so `len(numbers)`, which is 4, is one past the end. Work out the number inside your brackets for the list in this test. The last position is one less than the length, and the first line of the program already holds it.
  - id: round-brackets
    label: Uses round brackets to read an item
    shows: error
    errorType: TypeError
    errorContains: not callable
    code: |
      last_position = len(numbers) - 1
      last_item = numbers(last_position)
    feedback: |
      The error says the list was called, the way a function such as `len()` is called. Round brackets after a name mean "call this", and a list cannot be called. Reading an item from a list takes square brackets after the list name, with the position inside them.
  - id: stores-length
    label: Stores the length instead of the last item
    shows: wrong-result
    code: |
      last_position = len(numbers) - 1
      last_item = len(numbers)
    feedback: |
      Your `last_item` equals the number of items in the list. `len(numbers)` counts the items; it does not read one. An item only comes out of the list when a position stands inside brackets after the list name.
  - id: one-too-far-back
    label: Takes 1 away a second time
    shows: wrong-result
    code: |
      last_position = len(numbers) - 1
      last_item = numbers[last_position - 1]
    feedback: |
      Your `last_item` is the item right before the last one. The first line already took 1 away from the length, so `last_position` is the last position. Taking 1 away again moves one place too far back.

hints:
  - |
    `last_position` already holds a number that says where the last item is. What is still missing is the step that reads the item stored at that place.
  - |
    With `numbers = [40, 10, 30, 20]`, `last_position` is 3, and the item at position 3 is 20. To read the item at a position, write the position inside square brackets after the list name: `numbers[0]` is the item at position 0.
  - |
    The missing line has the shape `last_item = numbers[...]`, with a position inside the brackets. The first line of the program already stored that position in a variable.

explanation: |
  The first line of the program is already right. It only works out a position. Nothing has been read from the list yet.

  With `numbers = [40, 10, 30, 20]`:

  | expression | value | what it is |
  |---|---|---|
  | `len(numbers)` | 4 | how many items there are |
  | `len(numbers) - 1` | 3 | the last position |
  | `last_position` | 3 | the same number, stored |
  | `numbers[3]` | 20 | the item at position 3 |

  Four items sit at the positions 0, 1, 2 and 3, so position 3 is the last one. `numbers[4]` would ask for a fifth item that is not there, and Python would stop with `IndexError: list index out of range`.

  The missing line has to turn the position into the item. The task never asks for the position itself, such as 3. It asks for what the list stores at that position.

solution:
  code: |
    last_position = len(numbers) - 1
    last_item = numbers[last_position]
  walkthrough: |
    The missing line is `last_item = numbers[last_position]`.

    - `last_position` holds `len(numbers) - 1`. With 4 items that is 3, the last position.
    - `numbers[last_position]` reads the item at that position. The brackets mean "the item at".
    - `last_item = ...` stores that item under its own name.

    With one item, `len(numbers) - 1` is 0, and the item at position 0 is both the first and the last item.

    Python also accepts `numbers[-1]` for the last item. That is a separate feature: a negative number inside the brackets counts from the end. The checker accepts it. The forward loops in this app use `len(numbers) - 1`, which is why this exercise practices that form.

prerequisites: [positions-length-and-last]
related: [positions-first-and-last, copy-list-backwards]
next: positions-first-and-last
